name: CI
on:
  push: {branches: [main]}
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://kitchenly:kitchenly@localhost:5432/kitchenly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements/*.txt}
      - run: pip install -r requirements/dev.txt
      # Non-superuser app role: superusers bypass RLS and would make the isolation tests meaningless.
      - run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE kitchenly LOGIN PASSWORD 'kitchenly' NOSUPERUSER NOBYPASSRLS CREATEDB;" -c "CREATE DATABASE kitchenly OWNER kitchenly;"
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - run: pytest -q --create-db
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-only-ci-only-ci-only-ci-only-ci-only-ci-only-ci-only
          FIELD_ENCRYPTION_KEYS: mO9m4o5dJbS2k1bUuN4m0v8p5r3Zq7c9eXy1A2b3C4E=
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kitchenly:ci .
